<style>
  /* 색·글꼴 기본은 jalim-base.css. 여기엔 이 앱 고유 토큰만 둔다 */
  :root{
    --faint:#9b9487; --line2:#eeeae1; --panel:#edebe4;
    --green:var(--ink); --green-soft:var(--gold-soft); --green-deep:var(--ink);
    --mok:var(--wood); --hwa:var(--fire); --to:var(--earth); --geum:var(--metal); --su:var(--water);
    --shadow:none;
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{padding-bottom:150px;font-variant-numeric:tabular-nums}
  .wrap{max-width:520px;margin:0 auto;padding:16px}
  header.app{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
  header.app .seal{width:34px;height:34px;border-radius:8px;box-shadow:var(--shadow)}
  .seal{overflow:hidden}
  .seal svg{display:block;width:100%;height:100%}
  header.app .t{font-size:15px;font-weight:700}
  header.app .s{font-size:11px;color:var(--sub)}
  header.app .sp{flex:1}
  .hubchip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;flex:none;touch-action:manipulation}
  .btn{transition:.12s}
  .btn.wide{width:100%}
  .card{padding:16px;margin:0 0 14px}
  .muted{color:var(--sub)}
  .row{display:flex;gap:8px;align-items:center}
  input,select{max-width:100%;min-width:0}
  input[type=datetime-local]{-webkit-appearance:none;appearance:none}
  label.f{display:block;font-size:12px;color:var(--sub);margin:0 0 4px 2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  /* 오행 배지 */
  .el{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700}
  .el.목{background:var(--mok)} .el.화{background:var(--hwa)} .el.토{background:var(--to)}
  .el.금{background:var(--geum)} .el.수{background:var(--su)}

  /* 로또 공 */
  .ball{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;
    font-weight:700;font-size:18px;box-shadow:0 1px 2px rgba(30,25,10,.12)}
  .balls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  .ball .sub{font-size:9px;font-weight:600;opacity:.85;margin-top:-3px;color:inherit}

  /* 달력 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head h2{margin:0;font-size:22px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
  .cal-cell{aspect-ratio:1/1.08;border-radius:10px;border:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;overflow:hidden;padding-bottom:3px}
  .cal-cell.empty{border:none;background:transparent;cursor:default}
  .cal-cell .d{font-size:13px;font-weight:700;color:var(--ink)}
  .cal-cell.today{outline:2px solid var(--accent-ink);outline-offset:-2px}
  /* 칸에는 날짜·점수 색·작은 점만 — 錢(금색 점)·주의(빨간 점) 설명은 날짜를 눌렀을 때 */
  .cal-cell.money::after,.cal-cell.caution::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%}
  .cal-cell.money::after{background:var(--gold-deco)}
  .cal-cell.caution::after{background:var(--hwa)}
  .cal-cell .marks{display:flex;gap:1px;align-items:center;justify-content:center;font-size:10px;line-height:1;min-height:10px}
  .cal-cell .sc{display:none}   /* 점수는 칸 색으로, 숫자는 날짜를 누르면 */
  .cal-sticky{position:fixed;left:16px;right:16px;max-width:488px;margin:0 auto;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:5;transition:opacity .2s}.cal-sticky.off{opacity:0;pointer-events:none}.cal-sticky .btn{width:100%;box-shadow:var(--shadow)}
  .cal-cell .rd{position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--accent-ink)}
  .cal-cell.best{box-shadow:0 0 0 2.5px var(--gold-deco),0 0 8px var(--gold-soft);z-index:1}
  .cal-dow.sat{color:var(--gold);font-weight:700}
  .cal-dow small{display:block;font-size:9px;font-weight:600;line-height:1}
  .gframe{display:inline-block;width:11px;height:11px;border:2px solid var(--gold-deco);border-radius:3px;vertical-align:-2px;margin-right:3px}
  .tip{font-size:12px;color:var(--sub);margin-top:8px}
  .tip summary{cursor:pointer;list-style:none;display:inline-block}
  .tip summary::-webkit-details-marker{display:none}
  .tip p{margin:6px 0 0;line-height:1.55}
  input[type=range]{accent-color:var(--accent);width:100%}
  input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:6px;background:var(--surface-2)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:var(--shadow-sm)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
  .scale10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
  .scale10 i{height:9px;border-radius:3px;background:var(--line)}
  .scale10 i.on{background:var(--gold)}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--wood-soft);color:var(--wood-ink);border-radius:16px;padding:3px 9px;font-size:12px;margin:0 4px 4px 0}
  .chip button{border:none;background:none;color:var(--gold);cursor:pointer;font-size:13px;padding:0;line-height:1}
  textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;resize:vertical;min-height:64px}
  .prof-sub{font-size:12.5px;font-weight:700;margin:2px 0 5px;color:var(--ink)}
  .statrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
  .statrow .lab{width:52px;color:var(--sub);flex-shrink:0}
  .statrow .track{flex:1;height:9px;background:var(--panel);border-radius:5px;overflow:hidden}
  .statrow .fill{height:100%;background:var(--gold);border-radius:5px}
  .statrow .val{width:82px;text-align:right;color:var(--sub);flex-shrink:0}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:10px 12px}
  .tile .k{font-size:11px;color:var(--sub)}
  .tile .v{font-size:18px;font-weight:800;margin-top:3px;color:var(--ink)}
  .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-top:10px;flex-wrap:wrap}

  /* 하단 도크(앵커 광고) — 탭바는 공통 .jn-tabbar(떠 있는 캡슐 / PC 사이드바) */
  .dock{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:20;
    background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ad-anchor{border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3px 0 2px;background:var(--card)}
  .ad-disc{font-size:9px;color:var(--muted);text-align:center;margin:6px 0 0;line-height:1.3}
  /* 인터스티셜(다시 뽑기 5회) */
  .ad-gate{position:fixed;inset:0;background:rgba(20,18,10,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:22px}
  .ad-gate-box{background:var(--card);border-radius:16px;padding:16px;max-width:340px;width:100%;box-shadow:var(--shadow)}
  .ad-gate-h{font-size:14.5px;font-weight:700;text-align:center;margin:0 0 12px}
  @media(min-width:1024px){ body.jn-on .dock{left:var(--jn-nav-w)} body.jn-on header.app .hubchip{display:none} }
  .tabs.sub{margin:0 0 12px}

  .section{display:none}.section.on{display:block}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;
    background:var(--gold-soft);color:var(--gold)}
  /* 칩 토글(설정·패턴) — 조용한 기본, 켜짐만 골드 */
  .tgl{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;
    padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s;font-family:inherit}
  .tgl:active{transform:scale(.97)}
  .tgl.on{background:var(--wood-soft);color:var(--wood-ink);border-color:transparent}
  /* 스위치(사주 반영) */
  .switch{position:relative;width:42px;height:24px;border-radius:999px;border:none;cursor:pointer;
    background:var(--line);transition:.15s;flex:none;padding:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--card);transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .switch.on{background:var(--green)}
  .switch.on::after{transform:translateX(18px)}
  .numgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
  .numgrid button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--card);
    font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
  .numgrid button.fate{background:var(--gold);color:#fff;border-color:var(--gold)}
  .plist .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .plist .it:last-child{border:none}
  .plist .it.won{background:linear-gradient(90deg,var(--gold-soft),var(--card));border-left:4px solid var(--gold);border-bottom:none;border-radius:8px;padding:10px 10px 10px 9px;margin:4px 0}
  .winbadge{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:#fff;font-weight:800;font-size:12.5px;border-radius:8px;padding:4px 11px;margin-top:4px;box-shadow:0 1px 4px rgba(184,145,46,.4)}
  .winrow{background:linear-gradient(90deg,var(--gold-soft),var(--card));border:1px solid var(--gold);border-radius:10px;padding:8px 10px;margin:8px 0}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);box-shadow:var(--shadow);
    padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity var(--dur-base) var(--ease-in);z-index:40;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:.95;animation:jm-toast-in var(--dur-base) var(--ease-out)}
  .sijin{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .sijin .s{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:11px}
  .sijin .s.good{background:var(--ok-soft);border-color:var(--mok);color:var(--mok);font-weight:700}
  .daychip{font-size:11.5px;color:var(--sub);margin-top:2px}
  .daychip b{color:var(--ink)}
  .daychip .m{color:var(--gold);font-weight:700}
  a.link{color:var(--green);cursor:pointer;text-decoration:underline}
  .disclaimer{font-size:11px;color:var(--sub);text-align:center;margin:10px 0 4px}
  /* 첫 페이지 글귀 카드 */
  .lp-quote{margin:20px 0 0;padding:22px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    text-align:center;line-height:1.9;font-size:15px;font-family:"Gowun Batang",serif;color:var(--ink);word-break:keep-all}
  .lp-quote span{display:block}
  .lp-quote span+span{margin-top:1.1em}
  .lp-quote b{color:var(--green-deep)}
  .lp-sign{display:block;margin-top:16px!important;color:var(--sub);font-size:21px;font-family:"Nanum Pen Script",cursive}
  /* ===== 누르는 순간 반응 보강 (탭바·숫자판·달력 칸) ===== */
  .btn,.tgl,.numgrid button,.cal-cell,.chip button{touch-action:manipulation}
  .numgrid button:active:not(:disabled),.cal-cell:not(.empty):active{transform:scale(.95);transition:transform .1s ease-out}
  .chip button:active,a.link:active{opacity:.6}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
    .btn:active:not(:disabled),.tgl:active,.numgrid button:active:not(:disabled),.cal-cell:not(.empty):active{transform:none;opacity:.7}
  }
</style>

let user=null, profile=null, saju=null, favorSet=new Set(), jaeElem=null, jaeFav=false;

// ▼▼ 쿠팡 파트너스 배너 — <script> 위젯을 자체 srcdoc iframe에 넣어 그 안에서 실행 ▼▼

function coupangBanner(id,w,h){

/* ============ 하도 수리오행 (끝자리) ============ */

const EL_FACE=h=>JT.face(h);   // 번호공: 파스텔 면 + 진한 글자

/* ============ 유틸 ============ */
// 앱 아이콘과 동일한 심볼: 흰 원판에 오행 오색점(화·토·금·수) + 목 자리 네잎클로버, 골드 배경/스탬프 테두리
const SEAL=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`
  +`<rect width="100" height="100" fill="#279A56"/>`
  +`<path d="M51.2 68.4 C 52.3 76.9 58.2 80.9 66.4 82.4" fill="none" stroke="#F4FBF4" stroke-width="2.9" stroke-linecap="round"/>`
  +`<circle cx="50" cy="32.4" r="12.5" fill="#F4FBF4"/><circle cx="67.6" cy="50" r="12.5" fill="#F4FBF4"/>`
  +`<circle cx="50" cy="67.6" r="12.5" fill="#F4FBF4"/><circle cx="32.4" cy="50" r="12.5" fill="#F4FBF4"/>`
  +`<circle cx="50" cy="40.2" r="6.45" fill="#2F7D5B"/>`   /* 목 */

function dayScore(y,m,d){

  if(!r){ if(_probe) _probe.add(y+'-'+m); r={yongheeScore:0,incoming:[],rootClash:null}; }
  const jae=r.incoming.filter(x=>x.sibsin==='재성');
  const dayJae=jae.filter(x=>x.src.indexOf('일운')===0);          // 그날 축(일운)으로 들어온 재성
  const monthJae=jae.filter(x=>/^(대운|세운|월운)/.test(x.src));   // 한 달 내내 고정인 축의 재성
  const jaeFavToday=jae.some(x=>x.favorable);
  const dayJaeFav=dayJae.some(x=>x.favorable);      // 일운 재성이 용희신 → (신강형) 그날 목돈 기운
  const monthJaeFav=monthJae.some(x=>x.favorable);  // 고정 축 재성이 용희신 → (신강형) 이 달 재물 기운
  // 재다신약형: 재성이 용희신이 아닌 사주 → 일운에 신 돕는 용희신(인성·비겁)이 들어와 재를 감당하는 날
  const isBody=x=>x.sibsin==='비겁'||x.sibsin==='인성';
  const dayBodyFav=r.incoming.some(x=>x.src.indexOf('일운')===0&&x.favorable&&isBody(x));
  const monthBodyFav=r.incoming.some(x=>/^(대운|세운|월운)/.test(x.src)&&x.favorable&&isBody(x));
  // 손재 주의: 일운 천간·지지가 모두 재성이라 재가 신을 압도(재다신약형에서 소모·지출)
  const dayJaeHeavy=r.incoming.some(x=>x.src==='일운천간'&&x.sibsin==='재성')&&r.incoming.some(x=>x.src==='일운지지'&&x.sibsin==='재성');
  return {score:r.yongheeScore, jaeFavToday, dayJaeFav, monthJaeFav, dayBodyFav, monthBodyFav, dayJaeHeavy,

}
// 한 달치 점수 + 목돈 후보일 판정(달력/상세 공용)
function monthData(y,m){
  const days=new Date(y,m,0).getDate();
  const scores=[]; for(let d=1;d<=days;d++)scores.push(dayScore(y,m,d));
  const vals=scores.map(s=>s.score); const mn=Math.min(...vals),mx=Math.max(...vals);
  const norm=v=>mx===mn?0:(v-mn)/(mx-mn);
  // 사주 유형: 재성이 용희신이면 신강형(재성 들어오는 날=목돈), 아니면 재다신약형(신 돕는 용희신 날=재 감당→목돈)
  const isMoney=jaeFav ? (s=>s.dayJaeFav) : (s=>s.dayBodyFav);
  const moneyDays=scores.map((s,i)=>isMoney(s)?i+1:0).filter(Boolean);
  // 이 달 전체(고정 축)의 재물 기운 + 어느 축인지 (유형별)
  const s0=scores[0];
  const monthMoney=jaeFav ? (s0&&s0.monthJaeFav) : (s0&&s0.monthBodyFav);
  const wantSib=jaeFav ? (x=>x.sibsin==='재성') : (x=>x.sibsin==='비겁'||x.sibsin==='인성');
  const mj=(s0?s0.incoming:[]).filter(x=>x.favorable&&/^(대운|세운|월운)/.test(x.src)&&wantSib(x));
  const monthMoneyAxes=[...new Set(mj.map(x=>x.src.slice(0,2)))];
  // 손재·지출 주의일: 뿌리충(변동·지출) 또는 재다신약형의 재성 강습일. 목돈일이면 제외(목돈 우선)
  const isCaution=s=>!isMoney(s)&&(!!s.rootClash||(!jaeFav&&s.dayJaeHeavy));
  const cautionDays=scores.map((s,i)=>isCaution(s)?i+1:0).filter(Boolean);
  // 로또 추첨일(토) 랭킹: 목돈>일반>주의, 동급이면 발복 점수순
  const sat=[];
  for(let d=1;d<=days;d++){ if(new Date(y,m-1,d).getDay()===6){ const s=scores[d-1]; sat.push({d,money:isMoney(s),caution:isCaution(s),score:s.score}); } }
  const rankOf=x=>(x.money?2:x.caution?0:1)*1000+x.score;
  let bestSat=null; sat.forEach(x=>{ if(!bestSat||rankOf(x)>rankOf(bestSat))bestSat=x; });
  return {days,scores,norm,isMoney,moneyDays,monthMoney,monthMoneyAxes,jaeFav,isCaution,cautionDays,saturdays:sat,bestSat};
}

let recOpts={carry:false, consec:false, sameTail:false, recentN:0, oddEven:'auto', murphy:false,
             sajuCount:(()=>{try{const v=localStorage.getItem('lotto_saju_count');return(v==null||v==='auto')?'auto':Math.max(0,Math.min(6,+v));}catch(e){return 'auto';}})(),  // 6개 중 용희신 반영 개수(자동=전부)

let recentDraws=[];   // 최근 회차 draw 객체(최신순)

// 최근 5회 당첨번호 중 '중복되지 않은'(딱 한 번만 나온) 번호들
function recentNonRepeat(){

  return Object.keys(cnt).filter(n=>cnt[n]===1).map(Number);

const isEven=n=>n%2===0;
const hasConsec=a=>{const s=[...a].sort((x,y)=>x-y);return s.some((n,i)=>i>0&&n===s[i-1]+1);};
const sameTailPair=a=>{const seen={};return a.some(n=>{const t=n%10;if(seen[t])return true;seen[t]=1;return false;});};
// 오늘 기준 대운·세운·월운·일운을 모두 반영한 '유리 오행' 집합 (하루 단위 캐시)
let _tfCache=null, _tfKey='';
function transitFavor(){
  if(!saju||!saju.deep) return new Set();
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth()+1, d=now.getDate();
  const key=`${y}-${mo}-${d}:${profile&&profile.birth_year}`;
  if(_tfKey===key && _tfCache) return _tfCache;

    const dd=saju.deep; favor=new Set([...(dd.yongsin||[]),...(dd.heeshin||[]),...(dd.yongheeshin||[])]);
  }catch(e){}
  _tfCache=favor; _tfKey=key; return favor;
}
function baseWeights(forceSaju){
  const useSaju=(forceSaju!=null)?forceSaju:(recOpts.saju!==false);   // 사주 반영 on/off (개수 제어용 오버라이드)
  const tf=useSaju?transitFavor():new Set();    // 대운·세운·월운·일운(오늘 기운) 유리 오행
  const W={};
  for(let n=1;n<=45;n++){const el=hadoElem(n);let w=1;
    if(useSaju){ if(favorSet.has(el))w*=3; if(tf.has(el))w*=1.8; if(el===jaeElem&&jaeFav)w*=1.6; }
    if(myNumbers.fate.includes(n))w*=2.5; if(myNumbers.favorite.includes(n))w*=1.8; W[n]=w;}  // 내 숫자는 사주와 무관하게 유지
  return W;
}
// 사주 기반(가중치) + 선택 패턴 제약을 만족하는 6개 생성
function recommend(y,m,nonce,forceNum){
  const Wsaju=baseWeights(true), Wflat=baseWeights(false);        // 용희신 가중 / 무작위(내 숫자만 유지)
  const sajuOn=recOpts.saju!==false;
  const sajuTarget=!sajuOn?0:((recOpts.sajuCount==null||recOpts.sajuCount==='auto')?6:Math.max(0,Math.min(6,+recOpts.sajuCount)));  // 6개 중 용희신 반영 개수
  const rng=mulberry32(seedFrom((user?user.id:'demo')+':'+y+':'+m+':'+nonce+':'+(forceNum==null?'':forceNum)+':'+JSON.stringify(recOpts)));
  const pickFrom=(pool,Wm)=>{ if(!pool||!pool.length)return null; const tot=pool.reduce((a,n)=>a+Wm[n],0); let r=rng()*tot,i=0; while(i<pool.length-1&&r>Wm[pool[i]]){r-=Wm[pool[i]];i++;} return pool[i]; };
  const oe = recOpts.oddEven==='5:1'?[5,1]:recOpts.oddEven==='4:2'?[4,2]:recOpts.oddEven==='3:3'?[3,3]:recOpts.oddEven==='2:4'?[2,4]:recOpts.oddEven==='1:5'?[1,5]:null; // [짝,홀]
  const excl = (recOpts.murphy && murphyExclude.length) ? new Set(murphyExclude) : new Set(); // 머피: 산 번호 제외
  const carryPool=(latestDraw?latestDraw.numbers:[]).filter(n=>!excl.has(n));
  const nrPool=recentNonRepeat().filter(n=>!excl.has(n));
  function attempt(){
    const set=new Set(); const add=n=>{ if(n!=null&&!set.has(n)&&!excl.has(n)&&set.size<6) set.add(n); };
    let sajuLeft=sajuTarget;   // 남은 용희신 가중 슬롯: 소진되면 무작위로 채움
    const pick=(pool)=>{ const useS=sajuLeft>0; const n=pickFrom(pool, useS?Wsaju:Wflat); if(n!=null&&useS)sajuLeft--; return n; };
    if(forceNum!=null) set.add(forceNum);   // 앵커: 이 줄에 전주 번호 1개 강제 포함(제외 무시)
    if(recOpts.carry && forceNum==null){ add(pick(carryPool.filter(n=>!set.has(n)))); }
    if(recOpts.recentN>0){ let p=nrPool.filter(n=>!set.has(n)); let c=recOpts.recentN; while(c-->0&&p.length){const n=pick(p); add(n); p=p.filter(x=>x!==n);} }
    if(recOpts.consec){ let cand=[]; for(let b=1;b<=44;b++) if(!set.has(b)&&!set.has(b+1)&&!excl.has(b)&&!excl.has(b+1)) cand.push(b);
      if(cand.length){ const useS=sajuLeft>0; const Wm=useS?Wsaju:Wflat; const tot=cand.reduce((a,b)=>a+Wm[b]+Wm[b+1],0); let r=rng()*tot,i=0; while(i<cand.length-1&&r>Wm[cand[i]]+Wm[cand[i]+1]){r-=Wm[cand[i]]+Wm[cand[i]+1];i++;} const before=set.size; add(cand[i]); add(cand[i]+1); if(useS) sajuLeft-=(set.size-before); } }
    if(recOpts.sameTail){ const dg=Math.floor(rng()*10); let p=[]; for(let n=1;n<=45;n++) if(n%10===dg&&!set.has(n)&&!excl.has(n)) p.push(n);
      for(let k=0;k<2&&p.length;k++){ const n=pick(p); add(n); p=p.filter(x=>x!==n); } }
    let guard=0;
    while(set.size<6 && guard++<300){
      let pool=[]; for(let n=1;n<=45;n++) if(!set.has(n)&&!excl.has(n)) pool.push(n);
      if(oe){ const arr=[...set],ev=arr.filter(isEven).length,od=arr.length-ev;
        if(ev>=oe[0]) pool=pool.filter(n=>!isEven(n)); else if(od>=oe[1]) pool=pool.filter(isEven); }
      const n=pick(pool); if(n==null)break; add(n);
    }
    return [...set];
  }
  function violations(a){
    let v=0; if(a.length!==6) v+=10;
    if(oe){ if(a.filter(isEven).length!==oe[0]) v++; }
    if(recOpts.consec && !hasConsec(a)) v++;
    if(recOpts.sameTail && !sameTailPair(a)) v++;
    if(recOpts.carry && forceNum==null && carryPool.length && !a.some(n=>carryPool.includes(n))) v++;
    if(recOpts.recentN>0){ if(a.filter(n=>nrPool.includes(n)).length<Math.min(recOpts.recentN,nrPool.length)) v++; }
    if(recOpts.pastWin && winSubset5 && collidesPastWin(a)) v+=5;   // 역대 1등과 5개↑ 겹치면 강하게 회피
    return v;
  }
  let best=null,bestV=1e9;
  for(let i=0;i<800;i++){ const a=attempt(); const v=violations(a);
    if(v===0){ best=a; break; }
    if(v<bestV){ bestV=v; best=a; } }
  return (best||[]).slice(0,6).sort((a,b)=>a-b).map(n=>({n,el:hadoElem(n)}));
}
// 표시용: 현재 세트가 각 선택 패턴을 충족했는지
function recStatus(nums){
  const a=nums.map(x=>x.n), st=[];
  if(recOpts.carry) st.push({label:'전주 앵커 포함', ok:!!(latestDraw&&a.some(n=>latestDraw.numbers.includes(n)||n===latestDraw.bonus_no))});
  if(recOpts.recentN>0){ const nr=recentNonRepeat(); st.push({label:`최근5회 비중복 ${recOpts.recentN}개`, ok:a.filter(n=>nr.includes(n)).length>=Math.min(recOpts.recentN,nr.length)&&nr.length>0}); }
  if(recOpts.consec) st.push({label:'연속 쌍', ok:hasConsec(a)});
  if(recOpts.sameTail) st.push({label:'같은 뒷자리 쌍', ok:sameTailPair(a)});
  if(recOpts.oddEven!=='auto'){ const ev=a.filter(isEven).length; st.push({label:`짝:홀 ${recOpts.oddEven}`, ok:`${ev}:${6-ev}`===recOpts.oddEven}); }
  if(recOpts.murphy && murphyExclude.length){ const ex=new Set(murphyExclude); st.push({label:'머피 제외', ok:a.every(n=>!ex.has(n))}); }
  if(recOpts.pastWin && winSubset5){ st.push({label:'역대 1등 회피', ok:!collidesPastWin(a)}); }
  return st;
}

/* ---- 자림에 저장된 내 정보(공용 출생정보, core_profiles) ----
   읽기는 로그인했을 때만, 실패하면 없는 것처럼. 동의해 저장해 둔 정보라 이 앱이 처음이면 확인 단계 없이 그대로 이 앱 프로필로 쓴다(실패하면 입력칸을 채워 확인받음). */
const CORE_VER='v1';
let coreRow=null, corePrefill=null;
async function dbLoadCore(){
  if(DEMO||!sb||!user) return null;
  try{ const {data,error}=await sb.from('core_profiles').select('*').eq('user_id',user.id).maybeSingle(); return error?null:(data||null); }
  catch(e){ return null; }
}
// 공용 정보 → 이 앱 프로필 모양. 재물운은 윤달을 저장하지 않고(leap:false), 성별은 M/F, 시간 모름은 시·분 비움
function coreToLotto(c){
  const unk=!!c.time_unknown||c.birth_h==null;
  return { birth_year:c.birth_y, birth_month:c.birth_mo, birth_day:c.birth_d,
    birth_hour:unk?null:c.birth_h, birth_minute:unk?null:(c.birth_min==null?0:c.birth_min),
    calendar:c.calendar==='lunar'?'lunar':'solar', leap:false,
    gender:c.gender==='male'?'M':(c.gender==='female'?'F':null),
    city:(c.birth_city&&CITY_LNG[c.birth_city]!=null)?c.birth_city:null };
}
// 두 정보가 다른 곳(없는 값끼리는 비교하지 않는다)
function coreDiff(p,c){
  const a=coreToLotto(c), out=[];
  if(p.birth_year!==a.birth_year||p.birth_month!==a.birth_month||p.birth_day!==a.birth_day) out.push('생년월일');
  if((p.calendar||'solar')!==a.calendar) out.push('양력/음력');
  if((p.birth_hour==null?null:p.birth_hour)!==a.birth_hour||(p.birth_hour!=null&&(p.birth_minute||0)!==(a.birth_minute||0))) out.push('태어난 시각');
  if(p.gender&&a.gender&&p.gender!==a.gender) out.push('성별');
  if(p.city&&a.city&&p.city!==a.city) out.push('태어난 곳');
  return out;
}
const coreSig=c=>[c.birth_y,c.birth_mo,c.birth_d,c.birth_h,c.birth_min,c.calendar,c.leap,c.gender,c.birth_city,c.time_unknown].join('|');
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const LEAP_NOTE='자림에 저장된 정보는 윤달 출생이에요. 이 앱은 윤달을 따로 계산하지 않으니 날짜를 한 번 확인해 주세요.';
const birthLine=(cal,y,m,d,h,mi)=>`${cal==='lunar'?'음력 ':''}${y}.${m}.${d}${h==null?' · 시간 모름':' · '+h+'시'+(mi?' '+mi+'분':'')}`;
function coreLine(c){ const a=coreToLotto(c); return birthLine(a.calendar,a.birth_year,a.birth_month,a.birth_day,a.birth_hour,a.birth_minute); }
function profLine(p){ return birthLine(p.calendar,p.birth_year,p.birth_month,p.birth_day,p.birth_hour,p.birth_minute); }
// 이 앱에 따로 입력해 둔 정보를 자림에 저장(동의한 사람만)
async function saveCore(){
  const ok=$('#coreOk'); if(!ok||!ok.checked||!user||!sb||!profile) return;
  const btn=$('#coreSaveBtn'); if(btn) btn.disabled=true;
  const unk=profile.birth_hour==null;
  const row={ user_id:user.id, gender:profile.gender==='M'?'male':(profile.gender==='F'?'female':null), calendar:profile.calendar==='lunar'?'lunar':'solar', leap:false,
    birth_y:profile.birth_year, birth_mo:profile.birth_month, birth_d:profile.birth_day, birth_h:unk?null:profile.birth_hour, birth_min:unk?null:(profile.birth_minute||0),
    time_unknown:unk, birth_city:profile.city||null, consent_version:CORE_VER, consent_at:new Date().toISOString() };
  try{ const r=await sb.from('core_profiles').upsert(row,{onConflict:'user_id'}).select().maybeSingle();
    if(r.error) throw r.error; coreRow=r.data||row; toast('자림에 저장했어요'); renderTab(); }
  catch(e){ toast('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요'); if(btn) btn.disabled=false; }
}
// 이 앱에서 확정한 정보로 자림 공용 정보를 바꾼다(이미 동의한 사람이 버튼을 눌렀을 때만). 동의 시각·버전은 건드리지 않는다
async function overwriteCore(){
  if(!user||!sb||!profile||!coreRow) return;
  const btn=$('#coreOverBtn'); if(btn) btn.disabled=true;
  const unk=profile.birth_hour==null;
  const row={ user_id:user.id, gender:profile.gender==='M'?'male':(profile.gender==='F'?'female':coreRow.gender), calendar:profile.calendar==='lunar'?'lunar':'solar', leap:false,
    birth_y:profile.birth_year, birth_mo:profile.birth_month, birth_d:profile.birth_day, birth_h:unk?null:profile.birth_hour, birth_min:unk?null:(profile.birth_minute||0),
    time_unknown:unk, birth_city:profile.city||coreRow.birth_city||null };
  try{ const r=await sb.from('core_profiles').upsert(row,{onConflict:'user_id'}).select().maybeSingle();
    if(r.error) throw r.error; coreRow=r.data||Object.assign({},coreRow,row); toast('자림 정보도 바꿨어요'); renderTab(); }
  catch(e){ toast('바꾸지 못했어요. 잠시 뒤 다시 눌러 주세요'); if(btn) btn.disabled=false; }
}

  const p=Object.assign({}, profile, a, { gender:a.gender||profile.gender||null, city:a.city||profile.city||null });
  await dbSaveProfile(p); profile=p; await buildSaju(); toast('자림에 저장된 정보로 맞췄어요'); renderTab();
}

// 분석 탭 맨 위 카드: 자림에 저장 안내 / 값이 다를 때 알림 / 윤달 안내
function coreCardHtml(){
  if(!user||DEMO||!profile) return '';
  const st='margin:0 0 10px;font-size:16px';
  if(!coreRow){
    if(lsGet('lotto_core_later')==='1') return '';
    return `<div class="section on card"><h3 style="${st}">이 정보를 자림에 저장할까요?</h3>
      <p class="muted" style="font-size:12.5px;margin:0 0 6px">자림에 저장하면 오늘의 기운·만남·인생 다시 걷기에서 생년월일을 다시 입력하지 않아요.</p>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:8px 0;min-height:44px"><input type="checkbox" id="coreOk" onchange="$('#coreSaveBtn').disabled=!this.checked" style="width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--gold)"> 다른 자림 앱에서도 내 출생정보를 쓰는 데 동의해요</label>
      <div class="row" style="flex-wrap:wrap"><button class="btn" id="coreSaveBtn" disabled onclick="saveCore()">자림에 저장</button><button class="btn ghost" onclick="dismissCoreSave()">나중에</button></div>
      <p class="muted" style="font-size:11px;margin:8px 0 0">동의는 언제든 자림 허브의 내 계정에서 거둘 수 있어요.</p></div>`;
  }
  const diff=coreDiff(profile,coreRow), leap=coreRow.leap?`<p class="muted" style="font-size:11.5px;margin:8px 0 0">${LEAP_NOTE}</p>`:'';
  if(diff.length&&lsGet('lotto_core_keep')!==coreSig(coreRow)){
    return `<div class="section on card" style="border-color:var(--gold)"><h3 style="${st}">자림에 저장된 정보와 달라요</h3>
      <div style="font-size:13px;line-height:1.8"><div>자림 · <b>${coreLine(coreRow)}</b></div><div>이 앱 · <b>${profLine(profile)}</b></div></div>
      <p class="muted" style="font-size:11.5px;margin:6px 0 10px">다른 곳: ${diff.join(', ')}</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn" onclick="syncFromCore()">자림 정보로 맞추기</button>${coreRow.leap?'':'<button class="btn" id="coreOverBtn" onclick="overwriteCore()">자림도 이 값으로</button>'}<button class="btn ghost" onclick="keepOwn()">이 앱에서만</button></div>${leap}</div>`;
  }
  return leap?`<div class="section on card"><p class="muted" style="font-size:12px;margin:0">${LEAP_NOTE}</p></div>`:'';

/* ============ 로또 당첨결과 (커뮤니티 소스, CORS 허용) ============ */
const DRAW_SRC='https://smok95.github.io/lotto/results/';
let draws={};        // {회차: {draw_no,numbers,bonus_no,date,divisions}}
let latestDraw=null;
let drawSrcError=false;   // 당첨데이터 소스 연결 실패 여부(fallback 안내용)
try{ draws=JSON.parse(localStorage.getItem('lotto_draws_cache')||'{}'); }catch(e){}
function saveDraws(){ try{ localStorage.setItem('lotto_draws_cache',JSON.stringify(draws)); }catch(e){} }
async function fetchDraw(n){
  const r=await fetch(DRAW_SRC+n+'.json'); if(!r.ok) return null;
  const d=await r.json(); if(!d||!d.numbers) return null;
  draws[d.draw_no]=d; saveDraws(); return d;
}
async function getDraw(n){ if(draws[n]) return draws[n]; try{ return await fetchDraw(n); }catch(e){ return null; } }
async function loadLatestDraw(){
  try{ const r=await fetch(DRAW_SRC+'latest.json'); if(!r.ok) throw new Error('bad status');
    const d=await r.json(); if(d&&d.numbers){ draws[d.draw_no]=d; latestDraw=d; saveDraws(); drawSrcError=false; } }
  catch(e){ /* 오프라인·소스 장애 — 캐시 최신값 사용 */
    const keys=Object.keys(draws).map(Number); if(keys.length) latestDraw=draws[Math.max(...keys)];
    drawSrcError=true; }
}
/* ---- 역대 1등 당첨조합 회피 (전 회차 벌크 all.json, 새 회차 나오면 자동 최신화) ---- */
let winCombos=[], winCombosUpto=0, winSubset5=null;
try{ const wc=JSON.parse(localStorage.getItem('lotto_wincombos')||'null'); if(wc&&wc.combos){ winCombos=wc.combos; winCombosUpto=wc.upto||0; } }catch(e){}
// 6개 조합의 5개 부분집합(6가지) → 정렬 후 문자열 키. 후보가 역대 1등과 5개 이상(완전일치 포함) 겹치면 이 Set에 걸림
function subsets5(a6){ const a=[...a6].sort((x,y)=>x-y),out=[]; for(let skip=0;skip<6;skip++){ const s=[]; for(let i=0;i<6;i++) if(i!==skip) s.push(a[i]); out.push(s.join(',')); } return out; }
function buildWinSubset5(){ const s=new Set(); winCombos.forEach(c=>{ if(c&&c.length===6) subsets5(c).forEach(k=>s.add(k)); }); winSubset5=s; }
async function loadWinCombos(){
  const target=latestDraw?latestDraw.draw_no:0;
  if(winCombos.length && winCombosUpto>=target){ if(!winSubset5) buildWinSubset5(); return; }
  try{
    const r=await fetch(DRAW_SRC+'all.json'); if(!r.ok) throw 0;
    const arr=await r.json(); if(!Array.isArray(arr)||!arr.length) throw 0;
    winCombos=arr.filter(d=>d&&Array.isArray(d.numbers)&&d.numbers.length===6).map(d=>d.numbers);
    winCombosUpto=arr.reduce((mx,d)=>Math.max(mx,d.draw_no||0),0);
    try{ localStorage.setItem('lotto_wincombos',JSON.stringify({upto:winCombosUpto,combos:winCombos})); }catch(e){}
    buildWinSubset5();
  }catch(e){ if(winCombos.length && !winSubset5) buildWinSubset5(); }   // 실패 시 캐시로라도 동작
}
function collidesPastWin(arr){ if(!winSubset5||arr.length!==6) return false; return subsets5(arr).some(k=>winSubset5.has(k)); }

// 구매일 → 응당 참여 회차 (추첨=토요일 밤, 그 이전 구매는 당일 회차). latestDraw 기준 주간 역산.
function inferRound(iso){
  if(!iso||!latestDraw) return null;
  const ref=new Date(latestDraw.date); const p=new Date(iso);
  const weeks=Math.ceil(((p-ref)/(7*86400000))-1e-6);
  return Math.max(1, latestDraw.draw_no+weeks);
}
// 당첨 등수: 6=1등, 5+보너스=2등, 5=3등, 4=4등, 3=5등, 그외 0
function rankOf(picked, d){
  if(!picked||picked.length!==6||!d) return 0;
  const set=new Set(d.numbers); const m=picked.filter(n=>set.has(n)).length;
  const bonus=picked.includes(d.bonus_no);
  if(m===6) return 1; if(m===5&&bonus) return 2; if(m===5) return 3; if(m===4) return 4; if(m===3) return 5; return 0;
}
function prizeFor(rank,d){
  if(rank<1) return 0;
  if(d&&d.divisions&&d.divisions[rank-1]&&d.divisions[rank-1].prize) return d.divisions[rank-1].prize;
  return rank===4?50000:rank===5?5000:0;   // 4·5등 고정
}
// 내 구매(번호 6개 입력분) 자동 당첨 확인 → 결과를 구매기록에 반영
async function autoCheckWins(){
  let changed=false;
  for(const p of purchases){
    if(!p.numbers||p.numbers.length!==6) continue;
    const round=p.round||inferRound(p.purchased_at); if(!round) continue;
    const d=await getDraw(round); if(!d) continue;   // 아직 추첨 전이면 null
    const rank=rankOf(p.numbers,d);
    const patch={round, won:rank>0, won_rank:rank||null, won_amount:rank>0?prizeFor(rank,d):null};
    if(p.round!==patch.round||p.won!==patch.won||p.won_rank!==patch.won_rank||p.won_amount!==patch.won_amount){
      await dbUpdatePurchase(p.id,patch); changed=true;
    }
  }
  return changed;
}

/* ============ 초기화 / 인증 ============ */
async function init(){
  // 클라우드 세션이 있으면 로그인 상태로, 없으면 로컬 모드로 그대로 시작(로그인 강제 안 함).
  if(sb){
    try{
      const {data:{session}}=await sb.auth.getSession();
      user=session?session.user:null; DEMO=!user;
      sb.auth.onAuthStateChange((_e,s)=>{const u=s?s.user:null; if((u&&!user)||(!u&&user)){user=u; DEMO=!user; afterAuth();}});
    }catch(e){ user=null; DEMO=true; }
  }
  afterAuth();   // 첫 화면(랜딩) 없이 바로 앱으로
}
async function afterAuth(){
  DEMO=!user;
  profile=await dbLoadProfile();
  coreRow=await dbLoadCore(); corePrefill=null;
  if(!profile&&coreRow){   // 이 앱은 처음 + 자림에 저장된 정보 있음 → 입력칸을 채워 확인만 받는다
    const a=coreToLotto(coreRow);
    if(isMinorBirth(a.birth_year,a.birth_month,a.birth_day,a.calendar)){ renderMinorBlock(); return; }   // 복권은 만 19세 미만 불가 — 공용 정보라도 같은 규칙

// 만 19세 미만인지 — 음력 입력은 엔진이 바꿔 준 양력 생일로 계산
function isMinorBirth(y,m,d,cal){
  let sy=y, sm=m, sd=d;
  try{ const s=S.computeSaju(y,m,d,'',{calendar:cal||'solar'}); if(s&&s.solar){ sy=s.solar.y; sm=s.solar.m; sd=s.solar.d; } }catch(e){}
  const t=new Date(); let age=t.getFullYear()-sy; if(t.getMonth()+1<sm || (t.getMonth()+1===sm && t.getDate()<sd)) age--;
  return age<19;
}

// 티켓(한 장) 당첨 상태 계산: win / lose(확인완료) / wait(추첨전) / nonum
function ticketStatus(g){
  let anyDraw=false, won=false, bestRank=0, prize=0, hasNum=false, pending=false;
  g.forEach(p=>{
    if(!p.numbers||p.numbers.length!==6) return; hasNum=true;
    const round=p.round||inferRound(p.purchased_at); const d=round?draws[round]:null;
    if(!d){ pending=true; return; }
    anyDraw=true; const rk=rankOf(p.numbers,d);
    if(rk>0){ won=true; if(!bestRank||rk<bestRank)bestRank=rk; prize+=prizeFor(rk,d); }
  });
  if(won) return {state:'win',bestRank,prize};
  if(!hasNum) return {state:'nonum'};
  if(anyDraw && !pending) return {state:'lose'};
  return {state:'wait'};
}

function latestUnconfirmedTicket(){
  const order=[], groups={};
  purchases.forEach(p=>{ const key=p.ticket||p.id; if(!groups[key]){groups[key]=[];order.push(key);} groups[key].push(p); });
  const cands=order.map(key=>{
    const g=groups[key];
    const nums=[...new Set(g.filter(p=>p.numbers&&p.numbers.length).flatMap(p=>p.numbers))];
    if(!nums.length) return null;
    return {key, nums, state:ticketStatus(g).state, round:g[0].round||inferRound(g[0].purchased_at)||0, ord:order.indexOf(key)};
  }).filter(Boolean);
  if(!cands.length) return null;
  const pending=cands.filter(c=>c.state==='wait');   // 추첨 전(미확인) 우선
  if(pending.length) return pending.sort((a,b)=>b.round-a.round||a.ord-b.ord)[0];
  return cands.sort((a,b)=>a.ord-b.ord)[0];          // purchases는 최신이 앞
}

}

      <div id="wonbox" style="display:${p.won?'block':'none'}">
        <div class="grid2" style="margin-top:6px">
          <div><label class="f">당첨 금액(원)</label><input id="e_amt" type="number" value="${p.won_amount||''}" placeholder="5000"></div>
          <div><label class="f">등수</label><input id="e_rank" type="number" value="${p.won_rank||''}" placeholder="5"></div>
        </div>
      </div>
      <label class="f" style="margin-top:12px">메모 (선택)</label>
      <input id="e_memo" value="${esc(p.memo||'')}" placeholder="예: 편의점에서 자동">
      <button class="btn wide" style="margin-top:14px" onclick="savePurchaseEdit('${id}')">저장</button>
      <button class="btn ghost wide" style="margin-top:8px;border-color:var(--hwa);color:var(--hwa)" onclick="deletePurchase('${id}')">이 기록 삭제</button>
    </div>
  </div>`;
}
async function savePurchaseEdit(id){
  const v=x=>$('#'+x).value.trim();
  const dtv=v('e_dt');
  const nums=v('e_nums').split(/[^0-9]+/).map(x=>+x).filter(x=>x>=1&&x<=45);
  const won=$('#e_won').checked;
  await dbUpdatePurchase(id,{
    purchased_at:dtv?new Date(dtv).toISOString():null,
    round:v('e_round')?+v('e_round'):null,
    numbers:nums.length?nums:null,
    won, won_amount:won&&v('e_amt')?+v('e_amt'):null, won_rank:won&&v('e_rank')?+v('e_rank'):null,
    memo:v('e_memo')||null,
  });
  // 최신순 정렬 유지 (날짜 없으면 뒤로)
  purchases.sort((a,b)=>(new Date(b.purchased_at||0))-(new Date(a.purchased_at||0)));
  await autoCheckWins();   // 번호+회차 입력분은 공식 결과와 자동 대조
  toast('저장했어요'); renderTab();
}
async function deletePurchase(id){
  if(!confirm('이 구매 기록을 삭제할까요?'))return;
  await dbDeletePurchase(id); toast('삭제했어요'); renderTab();
}

/* ---- 내숫자 (추천 탭 안) ---- */
function numCardHtml(){
  const isSaved=n=>myNumbers.fate.includes(n)||myNumbers.favorite.includes(n);
  const grid=Array.from({length:45},(_,i)=>i+1).map(n=>
    `<button class="${isSaved(n)?'fate':''}" onclick="toggleNum(${n})">${n}</button>`).join('');
  const saved=[...new Set([...myNumbers.fate,...myNumbers.favorite])].sort((a,b)=>a-b);
  return `<div class="section on card">
    <h2 style="margin:0 0 6px">내 숫자</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;line-height:1.6">
      인연이 있거나 좋아하는 <b>나만의 숫자</b>를 저장해 두세요. 저장한 숫자는 <b>추천 번호를 뽑을 때 가중치가 높아져</b> 더 자주 포함됩니다.<br>숫자를 눌러 저장/해제하세요.</p>
    <div class="numgrid">${grid}</div>
    ${saved.length?`<p class="muted" style="font-size:12.5px;margin:12px 0 0">저장한 숫자 · <b style="color:var(--gold)">${saved.join(', ')}</b></p>`:''}
  </div>`;
}
async function toggleNum(n){
  // 단일 카테고리: 저장돼 있으면(구버전 '좋아하는' 포함) 해제, 없으면 저장
  const k=myNumbers.favorite.includes(n)?'favorite':'fate';
  await dbToggleNumber(n,k); renderTab();
}

/* ---- 결과 ---- */
function drawBalls(d){
  const b=d.numbers.map(n=>`<div class="ball" style="${EL_FACE(hadoElem(n))}">${n}</div>`).join('');
  return `<div class="balls">${b}<div style="display:grid;place-items:center;font-size:22px;color:var(--sub)">+</div><div class="ball" style="${EL_FACE(hadoElem(d.bonus_no))}">${d.bonus_no}</div></div>`;
}
function drawCard(d){
  if(!d) return '<p class="muted" style="font-size:13px">불러오지 못했어요.</p>';
  const dt=d.date?String(d.date).slice(0,10):'';
  const f=d.divisions&&d.divisions[0];
  return `<div style="text-align:center">
    <div class="muted" style="font-size:12px">${dt}</div>
    <h2 style="margin:2px 0 6px">${d.draw_no}회</h2>
    ${drawBalls(d)}
    ${f?`<p class="muted" style="font-size:12px;margin:8px 0 0">1등 ${Number(f.prize).toLocaleString()}원 · ${f.winners}명</p>`:''}
  </div>`;
}
async function refreshDraw(){ await loadLatestDraw(); await autoCheckWins(); toast('갱신했어요'); renderTab(); }
async function lookupRound(){
  const n=+document.getElementById('roundInput').value; if(!n){toast('회차 번호를 입력해주세요');return;}
  document.getElementById('lookupBox').innerHTML=SKEL;
  const d=await getDraw(n);
  document.getElementById('lookupBox').innerHTML=d?drawCard(d):'<p class="muted" style="font-size:13px">해당 회차를 찾지 못했어요.</p>';
}

// 서버에 쓰는 버튼: 처리 중 같은 인자로 다시 누르면 무시 + 누른 버튼 잠금 (두 번 탭 → 중복 저장 방지)
function guardTap(fn){
  const busy=new Set();
  return async function(...a){
    const key=JSON.stringify(a); if(busy.has(key)) return;
    const ev=window.event, b=ev&&ev.currentTarget&&ev.currentTarget.tagName==='BUTTON'?ev.currentTarget:null;
    busy.add(key); if(b) b.disabled=true;
    try{ return await fn.apply(this,a); } finally{ busy.delete(key); if(b&&b.isConnected) b.disabled=false; }
  };
}
addManual=guardTap(addManual);
sendFeedback=guardTap(sendFeedback); toggleNum=guardTap(toggleNum); dbToggleLucky=guardTap(dbToggleLucky);
