  .sijin{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}

  /* 만세력 */
  .manse{display:flex;gap:6px;text-align:center}
  .manse .col{flex:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .manse .cap{background:#faf6ec;font-size:11px;color:var(--sub);padding:4px 0}
  .manse .ss{font-size:10.5px;color:var(--sub);padding:5px 0 3px;min-height:22px}
  .manse .gz{color:#fff;padding:7px 2px}
  .manse .gz .h{font-size:23px;font-family:"Cormorant Garamond",serif;line-height:1.02;display:block}
  .manse .gz .k{font-size:10px;opacity:.92}
  .manse .jjg{font-size:10px;color:var(--sub);padding:4px 2px;line-height:1.5;min-height:20px}
  .manse .jjg .b{color:var(--ink);font-weight:700;text-decoration:underline}
  .manse .stage{font-size:10px;color:var(--sub);padding:2px 0 5px}
  .daychip{font-size:11.5px;color:var(--sub);margin-top:2px}
  .daychip b{color:var(--ink)}
  .daychip .m{color:var(--gold);font-weight:700}
  .plist .it.tap{cursor:pointer} .plist .it.tap:active{background:#faf6ec}
  a.link{color:var(--gold);cursor:pointer;text-decoration:underline}
  .disclaimer{font-size:11px;color:var(--sub);text-align:center;margin:10px 0 4px}
</style>

<script>
/* ============ 설정 ============ */
const SUPABASE_URL  = 'https://bbjifrxofwtkqbbyotgw.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiamlmcnhvZnd0a3FiYnlvdGd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTk3NDYsImV4cCI6MjA5ODgzNTc0Nn0.Ae4a2b5aZN0WHQf1ZlD8KQIqqwJKAU7cQ_h1RZGDilg';
const E = window.OhaengEngine;
const S = E.saju, T = E.transit, TL = E.timeline, TS = E.twelveStages;
// 로컬 모드(=이 기기 저장, 로그인 안 함)가 기본. 클라우드 로그인하면 꺼짐. afterAuth/init에서 갱신.
let DEMO = true;
let sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

/* ============ 상태 ============ */
let user=null, profile=null, saju=null, favorSet=new Set(), jaeElem=null, jaeFav=false;
let myNumbers={fate:[], favorite:[]};
let purchases=[];
let luckyDays=new Set();   // 'YYYY-MM-DD' 운 좋았던 날
let dreams={};             // {'YYYY-MM-DD': {note, tags:[]}}
let recNonce=0;
const now=new Date();
let calView={y:now.getFullYear(), m:now.getMonth()+1};
let tab='cal';

/* ============ 하도 수리오행 (끝자리) ============ */
const HADO={1:'수',6:'수',2:'화',7:'화',3:'목',8:'목',4:'금',9:'금',5:'토',0:'토'};
const hadoElem=n=>HADO[n%10];
const EL_COL={목:'var(--mok)',화:'var(--hwa)',토:'var(--to)',금:'var(--geum)',수:'var(--su)'};

/* ============ 유틸 ============ */
// 앱 아이콘과 동일한 심볼: 흰 원판에 오행 오색점(화·토·금·수) + 목 자리 네잎클로버, 골드 배경/스탬프 테두리
const SEAL=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`
  +`<rect x="0" y="0" width="100" height="100" fill="#b8912e"/>`
  +`<rect x="6.5" y="6.5" width="87" height="87" rx="15" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.6"/>`
  +`<circle cx="50" cy="50" r="33" fill="#fff"/>`
  +`<circle cx="75" cy="42" r="7" fill="#c0392b"/>`   /* 화 */
  +`<circle cx="65" cy="71" r="7" fill="#b8860b"/>`   /* 토 */
  +`<circle cx="35" cy="71" r="7" fill="#7f8c8d"/>`   /* 금 */
  +`<circle cx="25" cy="42" r="7" fill="#2c3e50"/>`   /* 수 */
  +`<circle cx="50" cy="50" r="4.5" fill="#b8912e"/>` /* 중앙 */
  +`<rect x="49.3" y="24" width="1.4" height="8" rx="0.7" fill="#2e7d5b"/>` /* 목: 줄기 */
  +`<g fill="#2e7d5b"><circle cx="46.4" cy="20.6" r="4.1"/><circle cx="53.6" cy="20.6" r="4.1"/>`
  +`<circle cx="46.4" cy="27.4" r="4.1"/><circle cx="53.6" cy="27.4" r="4.1"/></g>` /* 목: 네잎클로버 */
  +`</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dkey=(y,m,d)=>`${y}-${p2(m)}-${p2(d)}`;
const dkeyOf=iso=>{const t=new Date(iso);return dkey(t.getFullYear(),t.getMonth()+1,t.getDate());};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedFrom(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

/* ============ 엔진 계산 ============ */
function buildSaju(){
  const p=profile;
  saju=S.computeSaju(p.birth_year,p.birth_month,p.birth_day,
    (p.birth_hour==null?'':p.birth_hour),
    {minute:(p.birth_minute==null?'':p.birth_minute),calendar:p.calendar||'solar',leap:!!p.leap,city:p.city||undefined});
  const d=saju.deep;
  favorSet=new Set([...(d.yongsin||[]),...(d.heeshin||[]),...(d.yongheeshin||[])]);
  jaeElem=S.KE_[saju.dayMasterElem];      // 일간이 극하는 오행 = 재성
  jaeFav=favorSet.has(jaeElem);
}
// 특정 날짜의 재물운/발복 점수
function dayScore(y,m,d){
  const t=T.transitPillars(y,m,d);
  const extra=[
    {label:'월운',ganIdx:t.month.ganIdx,jiIdx:t.month.jiIdx,weight:0.5},
    {label:'일운',ganIdx:t.day.ganIdx,jiIdx:t.day.jiIdx,weight:0.8},
  ];
  const r=TL.scoreTimeline(saju.pillars,saju.deep,null,null,extra);
  const jae=r.incoming.filter(x=>x.sibsin==='재성');
  const jaeFavToday=jae.some(x=>x.favorable);
  return {score:r.yongheeScore, jaeFavToday, jaePresent:jae.length>0, jae, incoming:r.incoming,
          day:t.day, month:t.month, rootClash:r.rootClash};
}
// 한 달치 점수 + 목돈 후보일 판정(달력/상세 공용)
function monthData(y,m){
  const days=new Date(y,m,0).getDate();
  const scores=[]; for(let d=1;d<=days;d++)scores.push(dayScore(y,m,d));
  const vals=scores.map(s=>s.score); const mn=Math.min(...vals),mx=Math.max(...vals);
  const norm=v=>mx===mn?0:(v-mn)/(mx-mn);
  // 목돈 후보일: 재성이 길신으로 들어오거나(신강), 재성이 있으면서 그달 발복 상위 30%(신약이 재를 감당)
  const isMoney=s=>s.jaeFavToday||(s.jaePresent&&s.score>0&&norm(s.score)>=0.7);
  const moneyDays=scores.map((s,i)=>isMoney(s)?i+1:0).filter(Boolean);
  return {days,scores,norm,isMoney,moneyDays};
}

/* ============ 번호 추천 ============ */
let recOpts={carry:false, consec:false, sameTail:false, recentN:0, oddEven:'auto'};
let recentDraws=[];   // 최근 회차 draw 객체(최신순)
async function loadRecentDraws(k){
  recentDraws=[]; if(!latestDraw) return;
  for(let i=0;i<k;i++){ const d=await getDraw(latestDraw.draw_no-i); if(d) recentDraws.push(d); }
}
// 최근 5회 당첨번호 중 '중복되지 않은'(딱 한 번만 나온) 번호들
function recentNonRepeat(){
  const cnt={}; recentDraws.slice(0,5).forEach(d=>d.numbers.forEach(n=>cnt[n]=(cnt[n]||0)+1));
  return Object.keys(cnt).filter(n=>cnt[n]===1).map(Number);
}
const isEven=n=>n%2===0;
const hasConsec=a=>{const s=[...a].sort((x,y)=>x-y);return s.some((n,i)=>i>0&&n===s[i-1]+1);};
const sameTailPair=a=>{const seen={};return a.some(n=>{const t=n%10;if(seen[t])return true;seen[t]=1;return false;});};
function baseWeights(){
  const W={};
  for(let n=1;n<=45;n++){const el=hadoElem(n);let w=1;
    if(favorSet.has(el))w*=3; if(el===jaeElem&&jaeFav)w*=1.6;
    if(myNumbers.fate.includes(n))w*=2.5; if(myNumbers.favorite.includes(n))w*=1.8; W[n]=w;}
  return W;
}
// 사주 기반(가중치) + 선택 패턴 제약을 만족하는 6개 생성
function recommend(y,m,nonce){
  const W=baseWeights();
  const rng=mulberry32(seedFrom((user?user.id:'demo')+':'+y+':'+m+':'+nonce+':'+JSON.stringify(recOpts)));
  const pick=(pool)=>{ if(!pool||!pool.length)return null; const tot=pool.reduce((a,n)=>a+W[n],0); let r=rng()*tot,i=0; while(i<pool.length-1&&r>W[pool[i]]){r-=W[pool[i]];i++;} return pool[i]; };
  const oe = recOpts.oddEven==='3:3'?[3,3]:recOpts.oddEven==='4:2'?[4,2]:recOpts.oddEven==='2:4'?[2,4]:null; // [짝,홀]
  const carryPool=latestDraw?latestDraw.numbers:[];
  const nrPool=recentNonRepeat();
  function attempt(){
    const set=new Set(); const add=n=>{ if(n!=null&&!set.has(n)&&set.size<6) set.add(n); };
    if(recOpts.carry){ add(pick(carryPool.filter(n=>!set.has(n)))); }
    if(recOpts.recentN>0){ let p=nrPool.filter(n=>!set.has(n)); let c=recOpts.recentN; while(c-->0&&p.length){const n=pick(p); add(n); p=p.filter(x=>x!==n);} }
    if(recOpts.consec){ let cand=[]; for(let b=1;b<=44;b++) if(!set.has(b)&&!set.has(b+1)) cand.push(b);
      if(cand.length){ const tot=cand.reduce((a,b)=>a+W[b]+W[b+1],0); let r=rng()*tot,i=0; while(i<cand.length-1&&r>W[cand[i]]+W[cand[i]+1]){r-=W[cand[i]]+W[cand[i]+1];i++;} add(cand[i]); add(cand[i]+1); } }
    if(recOpts.sameTail){ const dg=Math.floor(rng()*10); let p=[]; for(let n=1;n<=45;n++) if(n%10===dg&&!set.has(n)) p.push(n);
      for(let k=0;k<2&&p.length;k++){ const n=pick(p); add(n); p=p.filter(x=>x!==n); } }
    let guard=0;
    while(set.size<6 && guard++<300){
      let pool=[]; for(let n=1;n<=45;n++) if(!set.has(n)) pool.push(n);
      if(oe){ const arr=[...set],ev=arr.filter(isEven).length,od=arr.length-ev;
        if(ev>=oe[0]) pool=pool.filter(n=>!isEven(n)); else if(od>=oe[1]) pool=pool.filter(isEven); }
      const n=pick(pool); if(n==null)break; add(n);
    }
    return [...set];
  }
  function violations(a){
    let v=0; if(a.length!==6) v+=10;
    if(oe){ if(a.filter(isEven).length!==oe[0]) v++; }
    if(recOpts.consec && !hasConsec(a)) v++;
    if(recOpts.sameTail && !sameTailPair(a)) v++;
    if(recOpts.carry && carryPool.length && !a.some(n=>carryPool.includes(n))) v++;
    if(recOpts.recentN>0){ if(a.filter(n=>nrPool.includes(n)).length<Math.min(recOpts.recentN,nrPool.length)) v++; }
    return v;
  }
  let best=null,bestV=1e9;
  for(let i=0;i<800;i++){ const a=attempt(); const v=violations(a);
    if(v===0){ best=a; break; }
    if(v<bestV){ bestV=v; best=a; } }
  return (best||[]).slice(0,6).sort((a,b)=>a-b).map(n=>({n,el:hadoElem(n)}));
}
// 표시용: 현재 세트가 각 선택 패턴을 충족했는지
function recStatus(nums){
  const a=nums.map(x=>x.n), st=[];
  if(recOpts.carry) st.push({label:'전주 번호 포함', ok:!!(latestDraw&&a.some(n=>latestDraw.numbers.includes(n)))});
  if(recOpts.recentN>0){ const nr=recentNonRepeat(); st.push({label:`최근5회 비중복 ${recOpts.recentN}개`, ok:a.filter(n=>nr.includes(n)).length>=Math.min(recOpts.recentN,nr.length)&&nr.length>0}); }
  if(recOpts.consec) st.push({label:'연속 쌍', ok:hasConsec(a)});
  if(recOpts.sameTail) st.push({label:'같은 뒷자리 쌍', ok:sameTailPair(a)});
  if(recOpts.oddEven!=='auto'){ const ev=a.filter(isEven).length; st.push({label:`짝:홀 ${recOpts.oddEven}`, ok:`${ev}:${6-ev}`===recOpts.oddEven}); }
  return st;
}

/* ============ 로또 당첨결과 (커뮤니티 소스, CORS 허용) ============ */
const DRAW_SRC='https://smok95.github.io/lotto/results/';
let draws={};        // {회차: {draw_no,numbers,bonus_no,date,divisions}}
let latestDraw=null;
try{ draws=JSON.parse(localStorage.getItem('lotto_draws_cache')||'{}'); }catch(e){}
function saveDraws(){ try{ localStorage.setItem('lotto_draws_cache',JSON.stringify(draws)); }catch(e){} }
async function fetchDraw(n){
  const r=await fetch(DRAW_SRC+n+'.json'); if(!r.ok) return null;
  const d=await r.json(); if(!d||!d.numbers) return null;
  draws[d.draw_no]=d; saveDraws(); return d;
}
async function getDraw(n){ if(draws[n]) return draws[n]; try{ return await fetchDraw(n); }catch(e){ return null; } }
async function loadLatestDraw(){
  try{ const r=await fetch(DRAW_SRC+'latest.json'); if(!r.ok) return;
    const d=await r.json(); if(d&&d.numbers){ draws[d.draw_no]=d; latestDraw=d; saveDraws(); } }
  catch(e){ /* 오프라인 등 — 캐시 최신값 사용 */
    const keys=Object.keys(draws).map(Number); if(keys.length) latestDraw=draws[Math.max(...keys)]; }
}
// 구매일 → 응당 참여 회차 (추첨=토요일 밤, 그 이전 구매는 당일 회차). latestDraw 기준 주간 역산.
function inferRound(iso){
  if(!latestDraw) return null;
  const ref=new Date(latestDraw.date); const p=new Date(iso);
  const weeks=Math.ceil(((p-ref)/(7*86400000))-1e-6);
  return Math.max(1, latestDraw.draw_no+weeks);
}
// 당첨 등수: 6=1등, 5+보너스=2등, 5=3등, 4=4등, 3=5등, 그외 0
function rankOf(picked, d){
  if(!picked||picked.length!==6||!d) return 0;
  const set=new Set(d.numbers); const m=picked.filter(n=>set.has(n)).length;
  const bonus=picked.includes(d.bonus_no);
  if(m===6) return 1; if(m===5&&bonus) return 2; if(m===5) return 3; if(m===4) return 4; if(m===3) return 5; return 0;
}
function prizeFor(rank,d){
  if(rank<1) return 0;
  if(d&&d.divisions&&d.divisions[rank-1]&&d.divisions[rank-1].prize) return d.divisions[rank-1].prize;
  return rank===4?50000:rank===5?5000:0;   // 4·5등 고정
}
// 내 구매(번호 6개 입력분) 자동 당첨 확인 → 결과를 구매기록에 반영
async function autoCheckWins(){
  let changed=false;
  for(const p of purchases){
    if(!p.numbers||p.numbers.length!==6) continue;
    const round=p.round||inferRound(p.purchased_at); if(!round) continue;
    const d=await getDraw(round); if(!d) continue;   // 아직 추첨 전이면 null
    const rank=rankOf(p.numbers,d);
    const patch={round, won:rank>0, won_rank:rank||null, won_amount:rank>0?prizeFor(rank,d):null};
    if(p.round!==patch.round||p.won!==patch.won||p.won_rank!==patch.won_rank||p.won_amount!==patch.won_amount){
      await dbUpdatePurchase(p.id,patch); changed=true;
    }
  }
  return changed;
}

function purchaseResultHtml(p){

  if(p.numbers&&p.numbers.length===6){
    const d=draws[p.round||inferRound(p.purchased_at)];
    if(d){ const matched=p.numbers.filter(n=>d.numbers.includes(n)).length, bonus=p.numbers.includes(d.bonus_no);
      return `<div class="muted" style="font-size:12px;margin-top:2px">낙첨 · ${matched}개 일치${bonus?' +보너스':''}</div>`; }
    return `<div class="muted" style="font-size:12px;margin-top:2px">추첨 대기</div>`;
  }
  return `<div class="muted" style="font-size:12px;margin-top:2px">결과 대기</div>`;
}
function viewBuy(){

  const order=[], groups={};

    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(p); });
  const list=order.map(key=>{
    const g=groups[key].slice().sort((a,b)=>(a.line||0)-(b.line||0));
    const head=g[0], dt=new Date(head.purchased_at);
    const when=`${dt.getFullYear()}.${dt.getMonth()+1}.${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const anyWon=g.some(p=>p.won), multi=g.length>1;
    const lines=g.map((p,i)=>{
      const label=multi?`${String.fromCharCode(65+i)}. `:'';
      const nums=p.numbers&&p.numbers.length?`${label}번호 ${p.numbers.join(', ')}`:`${label}<span class="muted">번호 없음</span>`;
      return `<div class="tap${p.won?' won':''}" onclick="editPurchase('${p.id}')" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;${i?'border-top:1px solid var(--line)':''}">

        <div class="muted" style="font-size:16px">›</div>

    }).join('');
    return `<div class="it${anyWon?' won':''}" style="display:block">
      <div style="font-weight:600;font-size:13.5px">${when}${head.round?` <span class="muted" style="font-weight:400">· ${head.round}회</span>`:''}${multi?` <span class="muted" style="font-weight:400">· ${g.length}게임</span>`:''}</div>
      ${dayChip(head.purchased_at)}

  }).join('')||'<p class="muted" style="font-size:13px">아직 구매 기록이 없어요.</p>';
  const todayCount=purchases.filter(p=>new Date(p.purchased_at).toDateString()===now.toDateString()).length;
  return `<div class="section on card" style="text-align:center">

    <p class="muted" style="font-size:12.5px;margin:0 0 12px">용지를 찍으면 회차·번호가 자동으로 들어가요${todayCount?` · 오늘 ${todayCount}회`:''}</p>

    <button class="btn ghost wide" style="margin-top:8px" onclick="buyNow()">＋ 시간만 빠르게 기록</button>
  </div>

let scanResult=null;   // {round, games:[[6]], raw}
// 동행복권 종이 용지 QR 표준 파서 (실물로 캘리브레이션 예정)
function parseTicketQR(text){
  const vm=String(text).match(/[?&]v=([^&\s]+)/);
  const v=(vm?vm[1]:String(text)).trim();
  const round=parseInt((v.match(/\d{4}/)||[])[0],10)||null;   // 앞 4자리 = 회차
  // 'q' 등으로 구간 분리 → 각 구간에서 12자리(6번호×2) 게임을 '전부' 추출.
  //  앞의 회차·방식표기 등 잉여는 12의 배수가 되도록 앞에서 잘라 무시.
  //  한 구간에 게임이 여러 개 붙어 있어도 12자리씩 끊어 모두 인식(누락 방지).
  const games=[];
  const asGame=s=>{ if(!/^\d{12}$/.test(s))return null;
    const ns=[]; for(let i=0;i<12;i+=2) ns.push(parseInt(s.slice(i,i+2),10));
    return (ns.every(n=>n>=1&&n<=45)&&new Set(ns).size===6)?ns:null; };
  v.split(/[^0-9]+/).forEach(seg=>{
    if(seg.length<12) return;
    let s=seg; const rem=s.length%12; if(rem) s=s.slice(rem);   // 앞쪽 잉여 제거
    for(let i=0;i+12<=s.length;i+=12){ const g=asGame(s.slice(i,i+12)); if(g) games.push(g); }
  });
  return {round,games,raw:v};
}
let scanMode='buy';    // 'buy'=구매기록 저장 / 'check'=당첨 즉석 확인
function scanTicket(mode){ scanMode=mode||'buy'; if(!window.jsQR){toast('QR 모듈 로드 실패');return;} const el=document.getElementById('qrFile'); el.value=''; el.click(); }
function handleQRFile(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{ (async()=>{
    const cv=document.getElementById('qrCanvas'), max=1000;
    const scale=Math.min(1,max/Math.max(img.width,img.height));
    cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
    const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height);
    const data=ctx.getImageData(0,0,cv.width,cv.height);
    const code=window.jsQR(data.data,cv.width,cv.height);
    URL.revokeObjectURL(img.src);
    if(!code){ scanResult={error:'QR을 찾지 못했어요. 용지의 QR코드가 또렷하게 나오도록 다시 찍어주세요.'}; }
    else{ scanResult=parseTicketQR(code.data); scanResult.qrText=code.data;
      if(scanMode==='check' && scanResult.round){ try{ await getDraw(scanResult.round); }catch(e){} } }
    renderScanConfirm();
  })(); };
  img.onerror=()=>{ scanResult={error:'이미지를 읽지 못했어요.'}; renderScanConfirm(); };
  img.src=URL.createObjectURL(f);
}

// 구매 패턴 분석 (요일·시간·재물발복점수·특이일 vs 당첨)
function analyzePurchases(){
  const cache={}; const md=(y,m)=>cache[y+'-'+m]||(cache[y+'-'+m]=monthData(y,m));
  const mk=()=>({c:0,w:0});
  const A={total:purchases.length,winCount:0,totalWon:0,bestRank:null,
    dow:Array.from({length:7},mk),
    time:{'새벽':mk(),'오전':mk(),'오후':mk(),'저녁':mk()},
    score:{'낮음':mk(),'보통':mk(),'높음':mk()},
    money:mk(),lucky:mk(),dream:mk()};
  purchases.forEach(p=>{
    const dt=new Date(p.purchased_at),y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
    const won=!!p.won; if(won){A.winCount++;A.totalWon+=(+p.won_amount||0); if(p.won_rank&&(!A.bestRank||p.won_rank<A.bestRank))A.bestRank=p.won_rank;}
    const bump=o=>{o.c++; if(won)o.w++;};
    bump(A.dow[dt.getDay()]);
    const h=dt.getHours(); bump(A.time[h<6?'새벽':h<12?'오전':h<18?'오후':'저녁']);
    const mm=md(y,m),s=mm.scores[d-1],sc=s?s.score:0;
    bump(A.score[sc<1?'낮음':sc<2?'보통':'높음']);
    if(s&&mm.isMoney(s))bump(A.money);
    if(luckyDays.has(dkey(y,m,d)))bump(A.lucky);
    if(dreams[dkey(y,m,d)])bump(A.dream);
  });
  A.winRate=A.total?Math.round(A.winCount/A.total*100):0;
  return A;
}
function distHtml(obj,keys){
  const max=Math.max(1,...keys.map(k=>obj[k].c));
  return keys.map(k=>{const o=obj[k];
    return `<div class="statrow"><span class="lab">${k}</span><span class="track"><span class="fill" style="width:${Math.round(o.c/max*100)}%"></span></span><span class="val">${o.c}회${o.w?` · 🎉${o.w}`:''}</span></div>`;
  }).join('');
}
const CHANCE_MATCH=6*6/45;      // 무작위 1장 기대 적중 개수 = 0.8
// 신호별 '평균 적중 개수' 집계 (번호 6개 입력 + 결과 확정된 구매만)
function signalMatches(){
  const cache={}; const md=(y,m)=>cache[y+'-'+m]||(cache[y+'-'+m]=monthData(y,m));
  const G={전체:[],발복높음:[],발복보통:[],발복낮음:[],목돈일:[],일반일:[],운좋은날:[],길몽꾼날:[]};
  purchases.forEach(p=>{
    if(!p.numbers||p.numbers.length!==6) return;
    const round=p.round||inferRound(p.purchased_at); const draw=draws[round]; if(!draw) return;
    const matched=p.numbers.filter(n=>draw.numbers.includes(n)).length;
    const dt=new Date(p.purchased_at),y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate(),dk=dkey(y,m,d);
    G.전체.push(matched);
    const mm=md(y,m),s=mm.scores[d-1],sc=s?s.score:0;
    (sc>=2?G.발복높음:sc>=1?G.발복보통:G.발복낮음).push(matched);
    (s&&mm.isMoney(s)?G.목돈일:G.일반일).push(matched);
    if(luckyDays.has(dk)) G.운좋은날.push(matched);
    const dr=dreams[dk]; if(dr && GILMONG.some(k=>((dr.note||'')+' '+(dr.tags||[]).join(' ')).includes(k))) G.길몽꾼날.push(matched);
  });
  return G;
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function matchRow(label,arr,baseAvg){
  if(!arr.length) return `<div class="statrow"><span class="lab" style="width:64px">${label}</span><span class="track"></span><span class="val" style="width:120px">표본 없음</span></div>`;
  const a=avg(arr), pct=Math.min(100,Math.round(a/3*100));
  const up=baseAvg!=null && a>baseAvg+0.001, dn=baseAvg!=null && a<baseAvg-0.001;
  return `<div class="statrow"><span class="lab" style="width:64px">${label}</span><span class="track"><span class="fill" style="width:${pct}%"></span></span><span class="val" style="width:120px">평균 ${a.toFixed(2)}개 <span class="muted">(${arr.length}건)</span> ${up?'▲':dn?'▼':''}</span></div>`;
}

    <div class="prof-sub" style="margin-top:12px">요일별 구매</div>${distHtml(dowObj,['일','월','화','수','목','금','토'])}
    <div class="prof-sub" style="margin-top:12px">시간대별 구매</div>${distHtml(A.time,['새벽','오전','오후','저녁'])}
    <p class="muted" style="font-size:11px;margin:10px 0 0">🎉는 그 칸에서 당첨된 횟수예요.</p>

      ${posSignals.length?`<div class="prof-sub" style="margin-top:14px">🏆 내 신호 랭킹</div>
        <p style="font-size:13px;margin:4px 0 0">가장 잘 맞은 신호: <b style="color:var(--gold)">${posSignals[0].label}</b> (평균 ${posSignals[0].avg.toFixed(2)}개, ${posSignals[0].n}건)${posSignals[0].avg>base?` · 전체보다 <b style="color:#2e7d5b">+${(posSignals[0].avg-base).toFixed(2)}</b>`:''}</p>

        <div><label class="f">구매 번호 (선택)</label><input id="e_nums" value="${p.numbers?p.numbers.join(','):''}" placeholder="3,11,22,..."></div>
      </div>
      <label class="f" style="margin-top:12px"><input type="checkbox" id="e_won" ${p.won?'checked':''} style="width:auto;margin-right:6px" onchange="document.getElementById('wonbox').style.display=this.checked?'block':'none'"> 당첨됐어요</label>
      <div id="wonbox" style="display:${p.won?'block':'none'}">
        <div class="grid2" style="margin-top:6px">
          <div><label class="f">당첨 금액(원)</label><input id="e_amt" type="number" value="${p.won_amount||''}" placeholder="5000"></div>
          <div><label class="f">등수</label><input id="e_rank" type="number" value="${p.won_rank||''}" placeholder="5"></div>
        </div>
      </div>
      <label class="f" style="margin-top:12px">메모 (선택)</label>
      <input id="e_memo" value="${esc(p.memo||'')}" placeholder="예: 편의점에서 자동">
      <button class="btn wide" style="margin-top:14px" onclick="savePurchaseEdit('${id}')">저장</button>
      <button class="btn ghost wide" style="margin-top:8px;border-color:var(--hwa);color:var(--hwa)" onclick="deletePurchase('${id}')">이 기록 삭제</button>
    </div>
  </div>`;
}
async function savePurchaseEdit(id){
  const v=x=>$('#'+x).value.trim();
  const dtv=v('e_dt'); if(!dtv){toast('구매 일시를 입력해주세요');return;}
  const nums=v('e_nums').split(/[^0-9]+/).map(x=>+x).filter(x=>x>=1&&x<=45);
  const won=$('#e_won').checked;
  await dbUpdatePurchase(id,{
    purchased_at:new Date(dtv).toISOString(),
    round:v('e_round')?+v('e_round'):null,
    numbers:nums.length?nums:null,
    won, won_amount:won&&v('e_amt')?+v('e_amt'):null, won_rank:won&&v('e_rank')?+v('e_rank'):null,
    memo:v('e_memo')||null,
  });
  // 최신순 정렬 유지
  purchases.sort((a,b)=>new Date(b.purchased_at)-new Date(a.purchased_at));
  await autoCheckWins();   // 번호+회차 입력분은 공식 결과와 자동 대조
  toast('저장했어요'); renderTab();
}
async function deletePurchase(id){
  if(!confirm('이 구매 기록을 삭제할까요?'))return;
  await dbDeletePurchase(id); toast('삭제했어요'); renderTab();
}

/* ---- 내숫자 ---- */
function viewNum(){
  const isSaved=n=>myNumbers.fate.includes(n)||myNumbers.favorite.includes(n);
  const grid=Array.from({length:45},(_,i)=>i+1).map(n=>
    `<button class="${isSaved(n)?'fate':''}" onclick="toggleNum(${n})">${n}</button>`).join('');
  const saved=[...new Set([...myNumbers.fate,...myNumbers.favorite])].sort((a,b)=>a-b);
  return `<div class="section on card">
    <h2 style="margin:0 0 6px">내 숫자</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;line-height:1.6">
      인연이 있거나 좋아하는 <b>나만의 숫자</b>를 저장해 두세요. 저장한 숫자는 <b>추천 번호를 뽑을 때 가중치가 높아져</b> 더 자주 포함됩니다.<br>숫자를 눌러 저장/해제하세요.</p>
    <div class="numgrid">${grid}</div>
    ${saved.length?`<p class="muted" style="font-size:12.5px;margin:12px 0 0">저장한 숫자 · <b style="color:var(--gold)">${saved.join(', ')}</b></p>`:''}
  </div>`;
}
async function toggleNum(n){
  // 단일 카테고리: 저장돼 있으면(구버전 '좋아하는' 포함) 해제, 없으면 저장
  const k=myNumbers.favorite.includes(n)?'favorite':'fate';
  await dbToggleNumber(n,k); renderTab();
}

/* ---- 결과 ---- */
function drawBalls(d){
  const b=d.numbers.map(n=>`<div class="ball" style="background:${LOTTO_BALL(n)};color:#333;text-shadow:none">${n}</div>`).join('');
  return `<div class="balls">${b}<div style="display:grid;place-items:center;font-size:22px;color:var(--sub)">+</div><div class="ball" style="background:${LOTTO_BALL(d.bonus_no)};color:#333;text-shadow:none">${d.bonus_no}</div></div>`;
}
function drawCard(d){
  if(!d) return '<p class="muted" style="font-size:13px">불러오지 못했어요.</p>';
  const dt=d.date?String(d.date).slice(0,10):'';
  const f=d.divisions&&d.divisions[0];
  return `<div style="text-align:center">
    <div class="muted" style="font-size:12px">${dt}</div>
    <h2 style="margin:2px 0 6px">${d.draw_no}회</h2>
    ${drawBalls(d)}
    ${f?`<p class="muted" style="font-size:12px;margin:8px 0 0">1등 ${Number(f.prize).toLocaleString()}원 · ${f.winners}명</p>`:''}
  </div>`;
}
function viewResult(){
  const wins=purchases.filter(p=>p.numbers&&p.numbers.length===6);
  const myWinsHtml=wins.length?wins.map(p=>{
    const round=p.round||inferRound(p.purchased_at);
    const d=draws[round];
    const dt=new Date(p.purchased_at); const when=`${dt.getFullYear()}.${dt.getMonth()+1}.${dt.getDate()}`;
    if(!d) return `<div class="it"><div style="flex:1"><b>${when}</b> · ${round||'?'}회<div class="muted" style="font-size:12px">번호 ${p.numbers.join(', ')} · 추첨 대기</div></div></div>`;
    const rank=rankOf(p.numbers,d); const matched=p.numbers.filter(n=>d.numbers.includes(n)).length;
    const bonus=p.numbers.includes(d.bonus_no);
    const nums=p.numbers.map(n=>d.numbers.includes(n)?`<b style="color:var(--gold)">${n}</b>`:(n===d.bonus_no?`<b style="color:var(--su)">${n}</b>`:n)).join(', ');
    return `<div class="it${rank>0?' won':''}"><div style="flex:1"><b>${when}</b> · ${d.draw_no}회
      <div class="muted" style="font-size:12px">번호 ${nums}</div>
      ${rank>0?`<div style="margin-top:4px"><span class="winbadge">🎉 ${rank}등 · ${Number(prizeFor(rank,d)).toLocaleString()}원</span></div>`:`<div class="muted" style="font-size:12.5px;margin-top:2px">낙첨 · ${matched}개 일치${bonus?' +보너스':''}</div>`}
    </div></div>`;
  }).join(''):'<p class="muted" style="font-size:13px">구매 기록에 6개 번호를 입력하면 자동으로 당첨을 확인해드려요. (구매 이력에서 기록을 눌러 번호 입력)</p>';
  return `<div class="section on card">
    <button class="btn wide" style="padding:14px;font-size:15px;margin-bottom:12px" onclick="scanTicket('check')">📷 용지로 당첨 확인</button>
    <div class="row"><h2 style="margin:0;flex:1">최신 회차</h2><button class="btn ghost sm" onclick="refreshDraw()">새로고침</button></div>
    <div id="latestBox" style="margin-top:8px">${latestDraw?drawCard(latestDraw):'<p class="muted" style="font-size:13px">불러오는 중… 인터넷 연결을 확인해주세요.</p>'}</div>
  </div>
  <div class="section on card">
    <h3 style="margin:0 0 8px;font-size:16px">지난 회차 조회</h3>
    <div class="row"><input id="roundInput" type="number" placeholder="회차 (예: 1200)" style="flex:1"><button class="btn sm" onclick="lookupRound()">조회</button></div>
    <div id="lookupBox" style="margin-top:10px"></div>
  </div>
  <div class="section on card">
    <h3 style="margin:0 0 8px;font-size:16px">내 번호 당첨 확인</h3>
    <div class="plist">${myWinsHtml}</div>
  </div>
  <p class="disclaimer">당첨번호 출처: 커뮤니티 데이터(smok95/lotto). 공식 결과는 동행복권에서 확인하세요.</p>`;
}
async function refreshDraw(){ await loadLatestDraw(); await autoCheckWins(); toast('갱신했어요'); renderTab(); }
async function lookupRound(){
  const n=+document.getElementById('roundInput').value; if(!n){toast('회차 번호를 입력해주세요');return;}
  document.getElementById('lookupBox').innerHTML='<p class="muted" style="font-size:13px">불러오는 중…</p>';
  const d=await getDraw(n);
  document.getElementById('lookupBox').innerHTML=d?drawCard(d):'<p class="muted" style="font-size:13px">해당 회차를 찾지 못했어요.</p>';
}

/* ---- 나 ---- */
function viewMe(){
  const p=saju.pillars, d=saju.deep, dayGan=p.day.gan;
  return `<div class="section on card">
    <h2 style="margin:0 0 8px">내 사주 만세력</h2>
    <div class="manse">
      ${manseCol('시주',p.hour,dayGan,false)}
      ${manseCol('일주',p.day,dayGan,true)}
      ${manseCol('월주',p.month,dayGan,false)}
      ${manseCol('연주',p.year,dayGan,false)}
    </div>
    <p class="muted" style="font-size:10.5px;margin:8px 0 0;text-align:center">십성(위) · 간지(오행색) · 지장간(본기 밑줄) · 지지십성 · 12운성</p>
    <div style="margin-top:14px;font-size:13.5px;line-height:1.9">
      <div>일간 · <b>${saju.dayMasterElem}</b></div>
      <div>신강/신약 · <b>${d.status}</b>${d.gangyakGrade&&d.gangyakGrade!==d.status?` (${d.gangyakGrade})`:''}</div>
      <div>용신 · <b style="color:var(--gold)">${(d.yongsin||[]).join(' / ')||'—'}</b>${(d.yongsin||[]).length>1?' <span class="muted" style="font-size:11px">(복수 후보)</span>':''}</div>
      <div>희신 · ${(d.heeshin||[]).join(' / ')||'—'}</div>
      <div>재성(재물) 오행 · <b style="color:${EL_COL[jaeElem]}">${jaeElem}</b> ${jaeFav?'<span class="pill">길신</span>':'<span class="muted" style="font-size:11px">신약이라 부조 우선</span>'}</div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost sm" onclick="renderProfileForm()">사주 수정</button>
      ${user?'<button class="btn ghost sm" onclick="logout()">로그아웃</button>':'<button class="btn ghost sm" onclick="renderLogin()">클라우드 로그인</button>'}
    </div>
    <p class="muted" style="font-size:11.5px;margin:10px 0 0">${user?`☁ 클라우드 동기화 중${user.email?' · '+esc(user.email):''}`:'📱 이 기기에 저장 중 — 로그인하면 여러 기기에서 동기화돼요.'}</p>
    <p class="disclaimer">재물운 달력·번호는 위 용신/재성 분석을 근거로 계산됩니다.</p>
  </div>`;
}
async function logout(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} user=null; DEMO=true; toast('로그아웃 — 이 기기 저장으로 전환'); afterAuth(); }

init();

  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
